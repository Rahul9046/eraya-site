/* ===========================================================================
   Eraya - holding page.

   Self-contained on purpose. This page shares no code, no data and no network
   call with the product: open the file and it renders. The tokens below are
   transcribed from docs/02-brand.md so the two cannot look like different
   companies, but nothing here imports anything from apps/web.
   =========================================================================== */

:root {
  color-scheme: light;           /* the cream palette IS the brand - see 02-brand.md */

  --canvas: #fbf7f2;
  --line: #e6dacb;
  --line-strong: #d7c7b3;
  --ink: #2a211c;
  --ink-muted: #6b5b51;
  --ink-subtle: #7b6a5e;
  --ember: #bd4f33;
  --ember-text: #a8452c;         /* terracotta AS text; --ember is fill-only (4.4:1) */

  --sans: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          system-ui, "Helvetica Neue", Arial, sans-serif;

  --gutter: clamp(1.5rem, 6vw, 5rem);
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--canvas);     /* explicit: never inherit a host ground */
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1rem;
  font-weight: 400;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; }

:focus-visible {
  outline: 2px solid var(--ember);
  outline-offset: 3px;
  border-radius: 2px;
}

/* --- Frame ---------------------------------------------------------------
   Full viewport, footer resting on the bottom hairline. 100svh rather than
   100vh so mobile browser chrome cannot push the footer out of reach. */

.page {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  padding:
    calc(env(safe-area-inset-top) + clamp(1.75rem, 5vw, 3rem))
    calc(env(safe-area-inset-right) + var(--gutter))
    calc(env(safe-area-inset-bottom) + clamp(1.25rem, 4vw, 2rem))
    calc(env(safe-area-inset-left) + var(--gutter));
}

/* --- Stage ---------------------------------------------------------------
   Mobile: one column, the lockup above the words.
   From 62rem: the lockup sits left of a hairline and the words right of it -
   the same left-aligned relationship the product's own hero uses. */

.stage {
  flex: 1;
  display: grid;
  align-content: center;
  justify-content: start;
  gap: clamp(2.25rem, 6vw, 3.5rem);
  padding: clamp(2rem, 8vh, 5rem) 0;
}

@media (min-width: 62rem) {
  .stage {
    grid-template-columns: auto minmax(0, 36rem);
    align-items: center;
    justify-content: center;
    gap: clamp(3rem, 6vw, 5rem);
  }
}

/* --- Lockup --------------------------------------------------------------
   The mark is the subject here rather than a label, so on a wide screen it is
   set large and alone above the wordmark. On a phone it steps down and sits
   beside it, where vertical space is the scarce thing. */

.lockup {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

@media (min-width: 62rem) {
  .lockup {
    flex-direction: column;
    align-items: flex-start;
    gap: 1.5rem;
  }
}

.mark {
  display: block;
  width: clamp(3.25rem, 13vw, 4.5rem);
  height: auto;
  flex: none;
}

@media (min-width: 62rem) {
  .mark { width: 9.5rem; }
}

.wordmark {
  margin: 0;
  font-size: clamp(1.75rem, 7vw, 2.25rem);
  font-weight: 700;
  letter-spacing: -0.035em;
  line-height: 1;
}

@media (min-width: 62rem) {
  .wordmark { font-size: 2.75rem; }
}

/* --- Words --------------------------------------------------------------- */

.say {
  display: grid;
  gap: clamp(1.25rem, 3vw, 1.75rem);
}

@media (min-width: 62rem) {
  .say {
    border-left: 1px solid var(--line);
    padding-left: clamp(3rem, 5vw, 4.5rem);
  }
}

.status {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin: 0;
  font-size: 0.8125rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ember-text);
}

/* A slow pulse on the dot. It is the one thing that says "being worked on"
   rather than "abandoned", which words alone say weakly on a holding page. */
.status::before {
  content: "";
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 50%;
  background: var(--ember);
  flex: none;
  animation: breathe 3.4s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.45; transform: scale(0.82); }
}

/* Sized so the two authored lines each hold on one line at every width,
   down to a 320px phone. Balancing is left off: the break is a writing
   decision, not something to let the browser re-make. */
.headline {
  margin: 0;
  font-size: clamp(1.875rem, 7.6vw, 3.125rem);
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.03em;
}

.headline span { display: block; }

/* The only coloured line of a heading anywhere in the brand. */
.headline .turn { color: var(--ember-text); }

.lede {
  margin: 0;
  max-width: 34ch;
  font-size: clamp(1.0625rem, 2.4vw, 1.1875rem);
  line-height: 1.65;
  color: var(--ink-muted);
}

.note {
  margin: 0;
  max-width: 42ch;
  font-size: 0.9375rem;
  line-height: 1.7;
  color: var(--ink-subtle);
}

/* 44px minimum target, per the product's own accessibility rules. */
.note a {
  display: inline-block;
  min-height: 44px;
  padding: 0.55rem 0;
  font-weight: 600;
  color: var(--ember-text);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 0.22em;
  text-decoration-color: var(--line-strong);
  transition: text-decoration-color 160ms ease, color 160ms ease;
}

.note a:hover {
  color: var(--ember);
  text-decoration-color: currentColor;
}

/* --- Footer -------------------------------------------------------------- */

.foot {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 0.5rem 1.5rem;
  padding-top: clamp(1rem, 3vw, 1.5rem);
  border-top: 1px solid var(--line);
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--ink-subtle);
}

.foot p { margin: 0; }

/* --- Entrance ------------------------------------------------------------
   One fade-and-rise on load, and nothing else on the page moves. */

.rise {
  animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
}

.rise-1 { animation-delay: 0.12s; }
.rise-2 { animation-delay: 0.04s; }
.rise-3 { animation-delay: 0.14s; }
.rise-4 { animation-delay: 0.24s; }
.rise-5 { animation-delay: 0.34s; }
.rise-6 { animation-delay: 0.44s; }

@keyframes rise {
  from { opacity: 0; transform: translateY(0.75rem); }
  to   { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  .rise, .status::before { animation: none; }
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}
</style>
